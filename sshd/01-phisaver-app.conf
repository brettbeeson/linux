# llm: For app.phisaver.com and app-staging.phisaver.com (audited OpenSSH 9.6).
# Keep the offered hybrid exchange first and Curve25519 as a compatible fallback.
KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256

# llm: Both audited hosts offer Ed25519 and RSA/SHA-2 host signatures.
HostKeyAlgorithms ssh-ed25519,rsa-sha2-512,rsa-sha2-256

# llm: Remove the audited SHA-1 and 64-bit MACs while retaining offered EtM MACs.
MACs umac-128-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com
