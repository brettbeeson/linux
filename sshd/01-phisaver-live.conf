# llm: For live.phisaver.com only (audited OpenSSH 7.4); upgrade this host separately.
# This older server did not advertise a hybrid post-quantum key exchange.
KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512

# llm: Retain offered Ed25519 and RSA/SHA-2 signatures; exclude ssh-rsa/SHA-1.
HostKeyAlgorithms ssh-ed25519,rsa-sha2-512,rsa-sha2-256

# llm: This host already offered these EtM MACs without SHA-1 MACs.
MACs umac-128-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com
