user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;

include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
}

http {
    ##
    # Basic settings
    ##

    sendfile on;
    tcp_nopush on;

    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;

    ##
    # Logging
    ##

    log_format with_host
        '$remote_addr - $remote_user [$time_local] '
        'host="$host" '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log with_host;

    ##
    # TLS
    ##

    # Explicitly disallow TLS 1.0/1.1 and all SSL versions.
    ssl_protocols TLSv1.2 TLSv1.3;

    # Shared TLS session cache for all HTTPS virtual hosts.
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Modern clients select the best cipher.
    ssl_prefer_server_ciphers off;

    ##
    # Connections
    ##

    keepalive_timeout 65;

    ##
    # Uploads (default max is 1Mb)
    ##
    client_max_body_size 10M;
    
    ##
    # Compression
    ##

    gzip on;
    gzip_vary on;
    gzip_proxied any;

    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/rss+xml
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    ##
    # Virtual hosts
    ##

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
